# Vincule com: supabase link --project-ref <seu-project-id>
project_id = "ljzttzfjtskblxekmquu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Produção (Torres Consulta). Localhost permanece em additional_redirect_urls para dev.
site_url = "https://www.torresconsultas.com.br"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://localhost:3000/recuperar-senha",
  "http://localhost:3000/redefinir-senha",
  "http://localhost:3000/consulta/app",
  "http://localhost:3000/consulta/redefinir-senha",
  "https://www.torresconsultas.com.br",
  "https://www.torresconsultas.com.br/**",
  "https://www.torresconsultas.com.br/recuperar-senha",
  "https://www.torresconsultas.com.br/redefinir-senha",
  "https://www.torresconsultas.com.br/consulta/app",
  "https://www.torresconsultas.com.br/consulta/redefinir-senha",
  "https://torresconsultas.com.br",
  "https://torresconsultas.com.br/**",
  "https://torresconsultas.com.br/recuperar-senha",
  "https://torresconsultas.com.br/redefinir-senha",
  "https://torresconsultas.com.br/consulta/app",
  "https://torresconsultas.com.br/consulta/redefinir-senha",
  "https://torres-vistoria-app.vercel.app",
  "https://torres-vistoria-app.vercel.app/**",
  "https://vistoria.torresconsultas.com.br",
  "https://vistoria.torresconsultas.com.br/**",
  "https://vistoria.torresconsultas.com.br/recuperar-senha",
  "https://vistoria.torresconsultas.com.br/redefinir-senha",
]

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
# Ligar só no Dashboard Auth (Authentication → Providers / Email) depois de:
# 1) o cliente enviar senha atual ou nonce (reauth) em must_change_password,
#    recovery e settings; 2) testar o fluxo de primeiro acesso.
# `config push` aqui pode quebrar must_change_password e recovery.
# NÃO marcar como ativo só porque o código existe — é PENDENTE DE CONFIGURAÇÃO.
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.rate_limit]
# Janela GoTrue: sign-in/sign-up por IP a cada 5 minutos (default 30).
sign_in_sign_ups = 10
token_verifications = 10
# SMTP próprio (Resend). 100/h era abuso-friendly; 30/h é o default com SMTP custom.
email_sent = 30

# Camada 4 — Turnstile no Auth (Dashboard, não `config push`).
# Ligar captcha no GoTrue: Authentication → Attack Protection / Captcha,
# provider Turnstile, mesmo TURNSTILE_SECRET_KEY das Edges.
# `enabled = true` aqui só vale após `supabase config push` — não usar: este
# arquivo referencia secrets via env() e um push cego pode gravar placeholder.
# Sem as duas chaves, o widget não aparece e o GoTrue não deve exigir captcha.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false

[studio]
enabled = true
port = 54323

[functions.create-report]
verify_jwt = true

[functions.generate-pdf]
verify_jwt = true

[functions.invite-user]
verify_jwt = true

[functions.onboard-company]
verify_jwt = true

[functions.compress-image]
verify_jwt = true

[functions.inspector-registrations]
verify_jwt = true

[functions.validate-report]
verify_jwt = false

[functions.inspector-signup]
verify_jwt = false

# ────────────────────────────────────────────────────────────────────────────────
# FASE 5 — Resend + Supabase Auth Send Email Hook
# ────────────────────────────────────────────────────────────────────────────────
#
# Este hook é chamado pelo Supabase Auth para eventos de e-mail (ex.: signup,
# recovery). A função send-email deve ser verificada por secret para evitar abuse.
#
# Secret só no Dashboard (Authentication → Hooks → Send Email).
# O campo `secrets` existe porque o CLI exige no `db push`.
# NÃO rode `config push` — o placeholder do env pode zerar o secret remoto.
# enabled = true precisa permanecer alinhado à produção; `config push` com false
# derruba confirmação de e-mail e recuperação de senha.
#
[auth.hook.send_email]
enabled = true
uri = "https://ljzttzfjtskblxekmquu.supabase.co/functions/v1/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[functions.send-email]
verify_jwt = false
